stage: 1
train:
  batch_size: 1
  num_epochs: 1
  num_samples: 5
  lr: 1.0e-4
  weight_decay: 1.0e-4
  device: auto
dataset:
  metadata_path: data/openscene/meta_datas/openscene-v1.0/meta_datas/meta_data_mini.pkl
  camera_root: data/openscene/sensor_blobs_mini
  image_size: [224, 224]
  camera_names:
    - CAM_F0
    - CAM_B0
    - CAM_L0
    - CAM_L1
    - CAM_L2
    - CAM_R0
    - CAM_R1
    - CAM_R2
  max_agent_instances: 16
loss:
  tasks:
    seg: false
    depth: false
    agent: true
    map: false
  task_weights:
    seg: 0.0
    depth: 0.0
    agent: 2.0
    map: 0.0
  seg:
    ignore_index: 255
  depth:
    loss_type: smooth_l1
    eps: 1.0e-3
  agent:
    cls_cost_weight: 2.0
    bbox_cost_weight: 0.25
    cls_gamma: 2.0
    cls_alpha: 0.25
    lambda_box: 0.25
    lambda_velocity: 0.2
    box_loss_type: l1
  map:
    cls_cost_weight: 2.0
    pts_cost_weight: 5.0
    cls_gamma: 2.0
    cls_alpha: 0.25
    lambda_cls: 2.0
    lambda_pts: 5.0
    lambda_dir: 0.005
