stage: 1
train:
  batch_size: 1
  num_epochs: 1
  num_samples: 2
  lr: 1.0e-4
  weight_decay: 1.0e-4
  device: auto
dataset:
  root: data/openscene_first_test_100
  image_size: [224, 224]
  camera_names:
    - CAM_F0
    - CAM_B0
    - CAM_L0
    - CAM_L1
    - CAM_L2
    - CAM_R0
    - CAM_R1
    - CAM_R2
  max_agent_instances: 16
  max_map_instances: 12
  C_agent: 4
  C_map: 4
  C_occ: 11
  C_flow: 3
  occ_size: [200, 200, 16]
loss:
  tasks:
    agent: true
    map: false
    occ: true
    flow: false
  task_weights:
    agent: 2.0
    map: 0.0
    occ: 1.0
    flow: 0.0
  agent:
    cls_cost_weight: 2.0
    bbox_cost_weight: 0.25
    cls_gamma: 2.0
    cls_alpha: 0.25
    lambda_box: 0.25
    lambda_velocity: 0.2
    lambda_dn: 0.0
    dn_enabled: false
    box_loss_type: l1
  map:
    cls_cost_weight: 2.0
    pts_cost_weight: 5.0
    cls_gamma: 2.0
    cls_alpha: 0.25
    lambda_cls: 2.0
    lambda_pts: 5.0
    lambda_dir: 0.005
  occ:
    class_weight:
    use_camera_mask: false
    enable_sem_scal_loss: false
    enable_geo_scal_loss: false
    enable_lovasz_loss: false
    lambda_sem: 0.0
    lambda_geo: 0.0
    lambda_lovasz: 0.0
  flow:
    loss_type: smooth_l1
