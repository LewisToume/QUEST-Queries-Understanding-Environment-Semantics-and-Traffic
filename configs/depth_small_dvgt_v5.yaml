# Shared DINOv2-S retained; scaled native DVGT geometry learns existing depth labels.
stage: seg_depth_offline
tasks: [depth]
frontend:
  version: dinov2_small_dvgt_depth_v5
  preserve_spatial_features: true
  native_repo: third_party/DVGT
  image_geometry: raw_opencv
  layer_indices: [3, 6, 9, 12]
  output_size: [252, 448]
  min_depth_m: 0.1
  geometry_dim: 256
  geometry_layers: 8
  geometry_levels: [1, 3, 5, 7]
  heads: 8
  dpt_features: 128
  ray_max_depth_m: 80.0
  amp_bf16: true
  gradient_checkpointing: true
  temporal:
    frames: 2
    causal: true
    missing_history: mask
    timestamp_scale: 1.0e-6
    max_gap_s: 1.1
train:
  num_samples: 5000
  epochs: 12
  batch_size: 1
  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  num_workers: 0
  log_interval: 500
  seed: 42
  missing_labels: error
loss:
  weights:
    seg_ce: 0.0
    depth_log: 1.0
    depth_relative: 0.5
    depth_gradient: 0.5
  depth:
    min_depth_m: 0.1
    max_depth_m: 80.0
    exclude_sky: false
paths:
  model_config: configs/model.yaml
  dataset_config: configs/stage1.yaml
  stage3_config: configs/stage3_map.yaml
  init_checkpoint: checkpoints/quest_stage3_map_spatial_v1.pt
  split_manifest: data/stage3_split.json
  capacity_audit: data/vector_map_capacity_audit.json
  seg_labels: data/soft_labels_seg_unavailable
  depth_labels: data/soft_labels_depth_dvgt1_v1_verified
  candidate_depth_labels: data/soft_labels_depth_dvgt1_v1_candidate
  checkpoint: checkpoints/quest_depth_small_dvgt_v5_verified.pt
  experimental_checkpoint: checkpoints/quest_depth_small_dvgt_v5.pt
