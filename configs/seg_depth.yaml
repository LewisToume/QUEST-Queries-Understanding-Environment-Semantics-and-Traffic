stage: seg_depth_offline
tasks: [seg, depth]
frontend:
  version: shared_image_pyramid_v1
  preserve_spatial_features: true
  layer_indices: [3, 6, 9, 12]
  channels: 128
  output_size: [252, 448]
  min_depth_m: 0.1
train:
  num_samples: 5000
  epochs: 5
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  num_workers: 0
  log_interval: 100
  seed: 42
  missing_labels: error
loss:
  weights:
    seg_ce: 1.0
    depth_log: 1.0
    depth_relative: 0.5
    depth_gradient: 0.5
  depth:
    min_depth_m: 0.1
    max_depth_m: 80.0
    exclude_sky: true  # Native Cityscapes class 10; never interpret valid_mask as sky detection.
paths:
  model_config: configs/model.yaml
  dataset_config: configs/stage1.yaml
  stage3_config: configs/stage3_map.yaml
  init_checkpoint: checkpoints/quest_stage3_map_spatial_v1.pt
  split_manifest: data/stage3_split.json
  capacity_audit: data/vector_map_capacity_audit.json
  seg_labels: data/soft_labels_segformer_cityscapes19_v1
  depth_labels: data/soft_labels_depth_metric3d_v1
  candidate_depth_labels: data/soft_labels_depth_metric3d_v1_candidate
  checkpoint: checkpoints/quest_seg_depth_v1.pt
  experimental_checkpoint: checkpoints/quest_seg_depth_experimental_v1.pt
