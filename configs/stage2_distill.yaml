stage: 2
supervision_source: teacher_only
tasks:
  agent: true
  map: false
  seg: false
  depth: false
dataset:
  max_agent_instances: 64
distill:
  batch_size: 1
  num_samples: 100
  epochs: 5
  proposal_warmup_epochs: 1
  lr: 5.0e-5
  device: auto
  model_path:
  bev_pretrain_path:
paths:
  soft_labels_dir: data/soft_labels_navformer
  checkpoint_path: checkpoints/quest_stage2_agent.pt
teachers:
  agent:
    name: Navformer
    enabled: true
    repo_path: /home/user/DataDisk/QUEST_WORK/Navformer
    config_path: /home/user/DataDisk/QUEST_WORK/Navformer/configs/navformer/track_map_nuplan_r50_navtrain.py
    checkpoint_path: /home/user/DataDisk/QUEST_WORK/Navformer/data/alg_engine/ckpts/track_map_nuplan_r50_navtrain_100pct_bs1x8.pth
  map:
    name: external_offline
    enabled: false
    supervision_source: nuplan_vector_gt
    # Navformer raster cross-representation KD is unavailable and stays OFF.
  seg:
    name: external_offline
    enabled: false
    candidate: SegFormer-B5-Cityscapes19
    export_config: configs/seg_teacher.yaml
  depth:
    name: external_offline
    enabled: false
    candidate: Metric3Dv2-ViT-L
    export_config: configs/depth_teacher.yaml
loss_weights:
  seg: 1.0
  depth: 1.0
  agent: 1.0
  map: 1.0
interfaces:
  offline_soft_labels: true
  online_teacher: false
  feature_distillation: false
  bev_distillation: false
