stage: 2
distill:
  batch_size: 1
  num_samples: 8
  lr: 5.0e-5
  temperature: 2.0
  device: auto
  model_path:
paths:
  soft_labels_dir: data/soft_labels
teachers:
  agent:
    name: StreamPETR
    enabled: true
    repo_path: third_party/StreamPETR
    config_path: third_party/StreamPETR/projects/configs/StreamPETR/stream_petr_r50_flash_704_bs2_seq_90e.py
    checkpoint_path: third_party/StreamPETR-main/ckpts/stream_petr_r50_flash_704_bs2_seq_90e.pth
    outputs:
      - class
      - 3d_box
      - velocity
  map:
    name: MapTRv2
    enabled: true
    repo_path: third_party/MapTR
    config_path: third_party/MapTR/projects/configs/maptr/maptr_tiny_r50_24e.py
    checkpoint_path:
    outputs:
      - map_class
      - vector_points
      - polyline
  occ:
    name: OccNet
    enabled: true
    repo_path: third_party/OccNet
    config_path: third_party/OpenScene/DriveEngine/projects/configs/bevformer/bev_tiny_occ_r50_nuplan.py
    checkpoint_path:
    openscene_baseline_path: third_party/OpenScene/DriveEngine/projects/configs
    outputs:
      - semantic_occupancy
  flow:
    name: ViDAR
    enabled: true
    repo_path: third_party/ViDAR
    config_path: third_party/ViDAR/projects/configs/vidar_pretrain/OpenScene/vidar_OpenScene_mini_1_8_3future.py
    checkpoint_path:
    outputs:
      - occupancy_flow
      - future_world
  segformer:
    name: SegFormer
    enabled: false
    role: archived_non_core
loss_weights:
  agent: 1.0
  map: 1.0
  occ: 1.0
  flow: 1.0
interfaces:
  hard_gt_supervision: true
  soft_label_distillation: false
  feature_distillation: false
  unlabeled_video: false
