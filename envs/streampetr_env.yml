name: streampetr_env
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.8
  - pip
  - pip:
      - torch==1.9.0+cu111
      - torchvision==0.10.0+cu111
      - torchaudio==0.9.0
      - -f https://download.pytorch.org/whl/torch_stable.html
      - mmcv-full==1.6.0
      - -f https://download.openmmlab.com/mmcv/dist/cu111/torch1.9.0/index.html
      - mmdet==2.28.2
      - mmsegmentation==0.30.0
      - numpy
      - scipy
      - tqdm
      - pyquaternion
      - nuscenes-devkit
      - shapely
      - yapf==0.40.1
