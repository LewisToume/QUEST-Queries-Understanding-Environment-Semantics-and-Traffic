name: flashocc_env
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.8.5
  - pip
  - pip:
      - torch==1.10.0+cu111
      - torchvision==0.11.0+cu111
      - torchaudio==0.10.0
      - -f https://download.pytorch.org/whl/torch_stable.html
      - mmcv-full==1.5.3
      - mmdet==2.25.1
      - mmsegmentation==0.25.0
      - numpy==1.23.5
      - numba==0.53.0
      - networkx==2.2
      - trimesh==2.35.39
      - setuptools==59.5.0
      - yapf==0.40.1
      - lyft_dataset_sdk
      - nuscenes-devkit
      - plyfile
      - scikit-image
      - tensorboard
      - pycuda
