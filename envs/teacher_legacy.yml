name: quest_teacher_legacy
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - cudatoolkit=11.1
  - numpy=1.19.5
  - matplotlib=3.5.2
  - pandas=1.4.4
  - scikit-image=0.19.3
  - setuptools=59.5.0
  - pip:
      - torch==1.10.1+cu111
      - torchvision==0.11.2+cu111
      - torchaudio==0.10.1
      - -f https://download.pytorch.org/whl/cu111/torch_stable.html
      - mmcv-full==1.4.0
      - mmdet==2.14.0
      - mmsegmentation==0.14.1
      - einops
      - fvcore
      - iopath==0.1.9
      - timm==0.6.13
      - numba==0.48.0
      - gdown
